<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoring You · Forgot Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080c12; --surface: #0d1320; --border: #1e2d45;
    --accent: #00c9ff; --accent2: #0066ff;
    --text: #e0e8f5; --muted: #5a7090;
    --danger: #ff4060; --green: #00e5a0;
    --mono: 'JetBrains Mono', monospace; --sans: 'Inter', sans-serif;
  }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center;
    justify-content: center; overflow: hidden; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(0,201,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,201,255,.04) 1px, transparent 1px);
    background-size: 40px 40px; animation: grid-drift 20s linear infinite; pointer-events: none;
  }
  @keyframes grid-drift { from { background-position: 0 0; } to { background-position: 40px 40px; } }
  .orb {
    position: fixed; width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,102,255,.12) 0%, transparent 70%);
    bottom: -150px; right: -100px; pointer-events: none;
  }
  .card {
    position: relative; z-index: 1; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 48px 44px; width: 440px;
    box-shadow: 0 0 0 1px rgba(0,201,255,.05), 0 32px 64px rgba(0,0,0,.6);
  }
  .logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
  .logo-icon {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
  .logo-text { font-family: var(--mono); font-size: 17px; font-weight: 500; letter-spacing: -.5px; }
  .logo-text span { color: var(--accent); }

  .step { display: none; }
  .step.active { display: block; }

  h1 { font-size: 24px; font-weight: 600; margin-bottom: 6px; letter-spacing: -.4px; }
  .sub { font-size: 13.5px; color: var(--muted); margin-bottom: 28px; line-height: 1.6; }

  .field { margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 500; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  input[type=text], input[type=email], input[type=password], input[type=tel] {
    width: 100%; background: rgba(0,201,255,.04); border: 1px solid var(--border);
    color: var(--text); font-family: var(--mono); font-size: 14px;
    padding: 12px 16px; border-radius: 8px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus { border-color: rgba(0,201,255,.5); box-shadow: 0 0 0 3px rgba(0,201,255,.1); }
  input::placeholder { color: var(--muted); }
  input:read-only { opacity: .6; cursor: default; }

  .msg-box {
    border-radius: 8px; font-size: 13px; padding: 12px 16px;
    margin-bottom: 18px; display: flex; align-items: flex-start; gap: 10px; font-weight: 500;
  }
  .msg-box.error   { background: rgba(255,64,96,.1);  border: 1px solid rgba(255,64,96,.3);  color: #ff8099; }
  .msg-box.success { background: rgba(0,229,160,.1);  border: 1px solid rgba(0,229,160,.3);  color: #00e5a0; }
  .msg-box.info    { background: rgba(0,201,255,.08); border: 1px solid rgba(0,201,255,.2);  color: #80deff; }
  .msg-box svg { flex-shrink: 0; width: 16px; height: 16px; margin-top: 1px; }

  .btn {
    display: block; width: 100%; padding: 13px; border-radius: 8px;
    border: none; cursor: pointer; font-family: var(--sans);
    font-size: 15px; font-weight: 600;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff; transition: opacity .2s, transform .1s; margin-top: 20px;
  }
  .btn:hover { opacity: .9; }
  .btn:active { transform: scale(.98); }

  .otp-row { display: flex; gap: 10px; margin-top: 4px; }
  .otp-row input {
    flex: 1; text-align: center; font-size: 22px; font-weight: 700;
    padding: 14px 4px; letter-spacing: .05em;
  }

  .strength-bar { height: 3px; border-radius: 2px; margin-top: 7px; background: var(--border); overflow: hidden; }
  .strength-fill { height: 100%; border-radius: 2px; width: 0%; transition: width .3s, background .3s; }
  .strength-label { font-size: 10px; color: var(--muted); margin-top: 4px; }

  .back-link {
    display: flex; align-items: center; gap: 6px;
    margin-top: 22px; font-size: 13px; color: var(--muted); text-decoration: none;
    transition: color .2s;
  }
  .back-link:hover { color: var(--accent); }
  .back-link svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

  .progress-dots { display: flex; gap: 6px; margin-bottom: 28px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: background .3s; }
  .dot.done { background: var(--green); }
  .dot.active { background: var(--accent); }

  .resend-row { text-align: center; margin-top: 14px; font-size: 12.5px; color: var(--muted); }
  .resend-btn { background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 12.5px; font-family: var(--sans); padding: 0; }
  .resend-btn:hover { text-decoration: underline; }
  #resend-timer { color: var(--muted); }
</style>
</head>
<body>
<div class="orb"></div>
<div class="card">
  <div class="logo-row">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    </div>
    <span class="logo-text">Monitoring<span> You</span></span>
  </div>

  <!-- Step indicators -->
  <div class="progress-dots">
    <div class="dot active" id="pd1"></div>
    <div class="dot" id="pd2"></div>
    <div class="dot" id="pd3"></div>
  </div>

  <!-- ── STEP 1: Enter username ── -->
  <div class="step active" id="step1">
    <h1>Reset Password</h1>
    <p class="sub">Enter your username and we'll send a verification code to your registered email or phone.</p>

    <div id="s1-error" class="msg-box error" style="display:none">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
      <span id="s1-error-text"></span>
    </div>

    <div class="field">
      <label>Username</label>
      <input type="text" id="inp-username" placeholder="Enter your username" autocomplete="username">
    </div>

    <button class="btn" onclick="step1Submit()">Send Verification Code →</button>
    <a class="back-link" href="/login">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Sign In
    </a>
  </div>

  <!-- ── STEP 2: Enter OTP ── -->
  <div class="step" id="step2">
    <h1>Verify Code</h1>
    <p class="sub">Enter the 6-digit code sent to <strong id="contact-hint">your contact</strong>.</p>

    <div id="s2-error" class="msg-box error" style="display:none">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
      <span id="s2-error-text"></span>
    </div>

    <div class="field">
      <label>Verification Code</label>
      <div class="otp-row">
        <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]">
      </div>
    </div>

    <div class="resend-row">
      <span id="resend-timer"></span>
      <button class="resend-btn" id="resend-btn" onclick="resendCode()" style="display:none">Resend code</button>
    </div>

    <button class="btn" onclick="step2Submit()">Verify Code →</button>
    <a class="back-link" href="javascript:void(0)" onclick="goStep(1)">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </a>
  </div>

  <!-- ── STEP 3: New password ── -->
  <div class="step" id="step3">
    <h1>New Password</h1>
    <p class="sub">Choose a strong new password for your account.</p>

    <div id="s3-error" class="msg-box error" style="display:none">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
      <span id="s3-error-text"></span>
    </div>

    <div class="field">
      <label>New Password</label>
      <input type="password" id="new-pw" placeholder="Min. 6 characters" oninput="checkStrength(this.value)">
      <div class="strength-bar"><div class="strength-fill" id="sfill"></div></div>
      <div class="strength-label" id="slabel"></div>
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="confirm-pw" placeholder="Re-enter password">
    </div>

    <button class="btn" onclick="step3Submit()">Reset Password →</button>
  </div>

</div>

<script>
let currentUsername = "";
let resetToken      = "";
let resendInterval  = null;

// ── STEP 1 ────────────────────────────────────────────────
async function step1Submit() {
  const username = document.getElementById('inp-username').value.trim();
  if (!username) { showError('s1', 'Please enter your username.'); return; }

  clearError('s1');
  try {
    const res  = await fetch('/api/forgot-password/request', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username })
    });
    const data = await res.json();
    if (!res.ok) { showError('s1', data.error || 'User not found.'); return; }

    currentUsername = username;
    document.getElementById('contact-hint').textContent = data.contact_hint;
    goStep(2);
    startResendTimer(60);
  } catch(e) { showError('s1', 'Connection error. Is the server running?'); }
}

// ── STEP 2 ────────────────────────────────────────────────
async function step2Submit() {
  const digits = [...document.querySelectorAll('.otp-digit')].map(i => i.value).join('');
  if (digits.length < 6) { showError('s2', 'Please enter all 6 digits.'); return; }

  clearError('s2');
  try {
    const res  = await fetch('/api/forgot-password/verify', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username: currentUsername, otp: digits })
    });
    const data = await res.json();
    if (!res.ok) { showError('s2', data.error || 'Invalid or expired code.'); return; }

    resetToken = data.token;
    goStep(3);
    clearInterval(resendInterval);
  } catch(e) { showError('s2', 'Connection error.'); }
}

async function resendCode() {
  document.getElementById('resend-btn').style.display = 'none';
  await fetch('/api/forgot-password/request', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ username: currentUsername })
  });
  [...document.querySelectorAll('.otp-digit')].forEach(i => i.value = '');
  document.querySelectorAll('.otp-digit')[0].focus();
  startResendTimer(60);
}

// ── STEP 3 ────────────────────────────────────────────────
async function step3Submit() {
  const pw  = document.getElementById('new-pw').value;
  const cfm = document.getElementById('confirm-pw').value;
  if (pw.length < 6)  { showError('s3', 'Password must be at least 6 characters.'); return; }
  if (pw !== cfm)     { showError('s3', 'Passwords do not match.'); return; }

  clearError('s3');
  try {
    const res  = await fetch('/api/forgot-password/reset', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ token: resetToken, password: pw })
    });
    const data = await res.json();
    if (!res.ok) { showError('s3', data.error || 'Reset failed. Start over.'); return; }
    window.location.href = '/login?success=reset';
  } catch(e) { showError('s3', 'Connection error.'); }
}

// ── HELPERS ───────────────────────────────────────────────
function goStep(n) {
  document.querySelectorAll('.step').forEach((s,i) => s.classList.toggle('active', i+1 === n));
  ['pd1','pd2','pd3'].forEach((id,i) => {
    const d = document.getElementById(id);
    d.className = 'dot' + (i+1 < n ? ' done' : i+1 === n ? ' active' : '');
  });
  if (n === 2) document.querySelector('.otp-digit').focus();
}

function showError(step, msg) {
  document.getElementById(step+'-error').style.display = 'flex';
  document.getElementById(step+'-error-text').textContent = msg;
}
function clearError(step) {
  document.getElementById(step+'-error').style.display = 'none';
}

function startResendTimer(seconds) {
  const btn   = document.getElementById('resend-btn');
  const timer = document.getElementById('resend-timer');
  btn.style.display = 'none';
  let remaining = seconds;
  timer.textContent = 'Resend in ' + remaining + 's';
  clearInterval(resendInterval);
  resendInterval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(resendInterval);
      timer.textContent = '';
      btn.style.display = 'inline';
    } else {
      timer.textContent = 'Resend in ' + remaining + 's';
    }
  }, 1000);
}

function checkStrength(pw) {
  const fill = document.getElementById('sfill');
  const lbl  = document.getElementById('slabel');
  let score = 0;
  if (pw.length >= 6)  score++;
  if (pw.length >= 10) score++;
  if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
  if (/\d/.test(pw))   score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const map = [
    {w:'0%',c:'',t:''},
    {w:'25%',c:'#ff3e5e',t:'Weak'},
    {w:'50%',c:'#ffb83e',t:'Fair'},
    {w:'75%',c:'#00c9ff',t:'Good'},
    {w:'100%',c:'#00e5a0',t:'Strong'},
  ];
  const s = map[Math.min(score,4)];
  fill.style.width = s.w; fill.style.background = s.c;
  lbl.textContent  = s.t; lbl.style.color = s.c;
}

// ── OTP input auto-advance ─────────────────────────────────
document.querySelectorAll('.otp-digit').forEach((inp, idx, all) => {
  inp.addEventListener('input', () => {
    inp.value = inp.value.replace(/\D/g,'').slice(-1);
    if (inp.value && idx < all.length - 1) all[idx+1].focus();
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !inp.value && idx > 0) all[idx-1].focus();
    if (e.key === 'ArrowLeft'  && idx > 0) all[idx-1].focus();
    if (e.key === 'ArrowRight' && idx < all.length-1) all[idx+1].focus();
  });
  inp.addEventListener('paste', e => {
    const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g,'');
    if (text.length >= 6) {
      [...all].forEach((box, i) => box.value = text[i] || '');
      all[5].focus();
      e.preventDefault();
    }
  });
});
</script>
</body>
</html>
