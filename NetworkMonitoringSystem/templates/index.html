<!DOCTYPE html>
<html>
<head>
    <title>Network Monitoring Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            margin: 0;
        }

        .header {
            background: #111;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .logout {
            float: right;
            background: red;
            padding: 8px 12px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .container {
            padding: 20px;
        }

        form input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 12px;
            background: green;
            color: white;
            border: none;
        }

        .card {
            display: inline-block;
            width: 200px;
            padding: 15px;
            margin: 10px;
            border-radius: 10px;
            color: white;
            text-align: center;
        }

        .green { background: green; }
        .red { background: red; }
        .blue { background: #007bff; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background: black;
            color: white;
        }

        .chart-box {
            width: 300px;
            margin: 20px auto;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>🔥 Network Monitoring Dashboard</h2>
    <a class="logout" href="/logout">Logout</a>
</div>

<div class="container">

<!-- ADD DEVICE -->
<form method="POST" action="/add">
    <input name="name" placeholder="Device Name" required>
    <input name="ip" placeholder="IP Address" required>
    <button type="submit">Add Device</button>
</form>

<hr>

<!-- STATS -->
<div id="stats"></div>

<!-- CHART -->
<div class="chart-box">
    <canvas id="statusChart"></canvas>
</div>

<!-- TABLE -->
<div id="table"></div>

</div>

<script>

let chart;

function updateChart(online, offline) {
    if (chart) chart.destroy();

    let ctx = document.getElementById('statusChart').getContext('2d');

    chart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ['Online', 'Offline'],
            datasets: [{
                data: [online, offline],
                backgroundColor: ['green', 'red']
            }]
        }
    });
}

async function loadData() {
    let res = await fetch('/api/devices');
    let data = await res.json();

    let online = data.filter(d => d.status === "Online").length;
    let offline = data.filter(d => d.status === "Offline").length;

    // STATS
    document.getElementById("stats").innerHTML = `
        <div class="card green">Online <br> ${online}</div>
        <div class="card red">Offline <br> ${offline}</div>
        <div class="card blue">Total <br> ${data.length}</div>
    `;

    // CHART UPDATE
    updateChart(online, offline);

    // TABLE
    let html = `
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>IP</th>
            <th>Status</th>
            <th>Last Checked</th>
        </tr>
    `;

    data.forEach(d => {
        let color = d.status === "Online" ? "green" : "red";

        html += `
        <tr>
            <td>${d.id}</td>
            <td>${d.name}</td>
            <td>${d.ip}</td>
            <td style="color:${color}; font-weight:bold">${d.status}</td>
            <td>${d.last_checked}</td>
        </tr>
        `;
    });

    html += "</table>";

    document.getElementById("table").innerHTML = html;
}

setInterval(loadData, 3000);
loadData();

</script>

</body>
</html>
